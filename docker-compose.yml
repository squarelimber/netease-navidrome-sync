services:
  ncm-api:
    image: moefurina/ncm-api:latest
    container_name: ncm-api
    environment:
      - ENABLE_GENERAL_UNBLOCK=true
      - ENABLE_FLAC=true
    ports:
      - "8679:3000"
    restart: unless-stopped

  navidrome-sync:
    build: .
    container_name: navidrome-sync
    depends_on:
      - ncm-api
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 改成你的实际音乐目录（必须与 Navidrome 挂载的是同一目录）
      - /path/to/your/music:/music
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
      - ./app:/app/app
    ports:
      - "8678:8678"
    restart: unless-stopped
