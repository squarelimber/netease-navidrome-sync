services:
  navidrome-sync:
    build: .
    container_name: navidrome-sync
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 改成你的实际音乐目录（必须与 Navidrome 挂载的是同一目录）
      - /path/to/your/music:/music
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8678:8678"
    restart: unless-stopped
