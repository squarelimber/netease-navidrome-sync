services:
  ncm-api:
    # 锁定版本避免 latest 漂移导致行为突变；升级时手动改 tag
    image: moefurina/ncm-api:4.39.0
    container_name: ncm-api
    environment:
      - ENABLE_GENERAL_UNBLOCK=true
      - ENABLE_FLAC=true
    ports:
      - "8679:3000"
    restart: unless-stopped

  navidrome-sync:
    build:
      context: .
      args:
        # 国内网络 pip 下载慢时，取消注释换镜像源（构建更快）
        # PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: navidrome-sync
    depends_on:
      - ncm-api
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 改成你的实际音乐目录（必须与 Navidrome 挂载的是同一目录）
      - /path/to/your/music:/music
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
      - ./app:/app/app
    ports:
      - "8678:8678"
    restart: unless-stopped
